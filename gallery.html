<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f1f3f5;
      --text-main: #495057;
      --radius: 12px;
      --gap: 16px;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 48px 32px 80px;
    }

    .header {
      max-width: 900px;
      margin: 0 auto 40px;
    }

    .header-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.15;
      display: block;
    }

    .header-email {
      font-size: 0.82rem;
      color: var(--text-main);
      display: block;
      margin-top: 4px;
    }

    .grid-wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
    }

    .cell {
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: #dee2e6;
    }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .cell:hover img {
      transform: scale(1.08);
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .lightbox.show { display: flex; }

    .lightbox img {
      max-width: 88vw;
      max-height: 88vh;
      border-radius: 8px;
      object-fit: contain;
      animation: lbIn 0.22s ease;
    }

    @keyframes lbIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .lightbox-close {
      position: fixed;
      top: 24px; right: 32px;
      font-size: 2rem;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
      line-height: 1;
    }
    .lightbox-close:hover { opacity: 1; }
  </style>
</head>
<body>

  <header class="header">
    <span class="header-name">Your Name</span>
    <span class="header-email">yourmail@example.com</span>
  </header>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&#215;</button>
    <img id="lightboxImg" src="" alt="" />
  </div>

  <script>
    // ================================================================
    // 이미지 추가 방법:
    //   1. 레포에 이미지 파일 업로드 (예: images/ 폴더)
    //   2. 아래 배열에 경로 추가 → 예) 'images/work01.jpg'
    //
    // 이미지 삭제: 배열에서 해당 줄 제거
    // 최대 12장 (3행 4열). 12장 미만이면 있는 것만 표시.
    // ================================================================
    const IMAGES = [
      // 'images/work01.jpg',
      // 'images/work02.png',
      // 'images/work03.jpg',
    ];
    // ================================================================

    const MAX = 12;
    const grid = document.getElementById('grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    IMAGES.slice(0, MAX).filter(Boolean).forEach(src => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      img.loading = 'lazy';
      img.addEventListener('click', () => {
        lightboxImg.src = src;
        lightbox.classList.add('show');
      });
      cell.appendChild(img);
      grid.appendChild(cell);
    });

    document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('show'));
    lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('show'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') lightbox.classList.remove('show'); });
  </script>
</body>
</html>
